name: build

on:
  workflow_dispatch:
  push:
    branches: [ '[0-9]+.[0-9]' ]
  pull_request:
    branches: [ '[0-9]+.[0-9]' ]

permissions: {}

env:
  FLOW_CONTEXT: Testing
  NEOS_DIST_FOLDER: neos-development-distribution
  NEOS_FOLDER: neos-development-collection

jobs:
  static-analysis:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Static analysis (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    defaults:
      run:
        working-directory: ${{ env.NEOS_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-neos` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-neos
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}
          collection-path: ${{ env.NEOS_FOLDER }}
          distribution-path: ${{ env.NEOS_DIST_FOLDER }}

      - name: Static analysis
        run: cd Packages/Neos && composer lint:phpstan

  unit-tests:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Unit tests (PHP ${{ matrix.php }}, deps: ${{ matrix.dependencies || 'highest' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      memcached:
        image: memcached:alpine
        ports:
          - "11211:11211"
    defaults:
      run:
        working-directory: ${{ env.NEOS_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-neos` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-neos
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}
          collection-path: ${{ env.NEOS_FOLDER }}
          distribution-path: ${{ env.NEOS_DIST_FOLDER }}

      - name: Run unit tests
        run: bin/phpunit --colors -c Build/BuildEssentials/PhpUnit/UnitTests.xml

  functional-tests:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Functional tests (PHP ${{ matrix.php }}, ${{ matrix.db.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        db:
          - { engine: mysql, image: 'mariadb:10.6', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' }
          - { engine: pgsql, image: 'postgres:14-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' }
        include:
          # Additional MySQL engines.
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.0', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.4', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          # Bleeding-edge engines.
          - { php: '8.5', db: { engine: mysql, image: 'mariadb:12.2', port: 3306, options: '--health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.5', db: { engine: pgsql, image: 'postgres:18-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' } }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_USER: neos
          MYSQL_PASSWORD: neos
          MYSQL_DATABASE: flow_functional_testing
          MYSQL_ROOT_PASSWORD: neos
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos
          POSTGRES_DB: flow_functional_testing
        ports:
          - "${{ matrix.db.port }}:${{ matrix.db.port }}"
        options: ${{ matrix.db.options }}
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      memcached:
        image: memcached:alpine
        ports:
          - "11211:11211"
    defaults:
      run:
        working-directory: ${{ env.NEOS_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-neos` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-neos
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}
          collection-path: ${{ env.NEOS_FOLDER }}
          distribution-path: ${{ env.NEOS_DIST_FOLDER }}

      - uses: ./.github/actions/configure-neos
        with:
          db-engine: ${{ matrix.db.engine }}
          db-port: ${{ matrix.db.port }}
          working-directory: ${{ env.NEOS_DIST_FOLDER }}
          flow-context: ${{ env.FLOW_CONTEXT }}

      - name: Run migrations to test if they work
        run: FLOW_CONTEXT=Testing ./flow doctrine:migrate

      - name: Run functional tests
        run: bin/phpunit --colors --stop-on-failure -c Build/BuildEssentials/PhpUnit/FunctionalTests.xml --testsuite "Neos tests"

  behavioral-tests:
    permissions:
      contents: read # to fetch code (actions/checkout)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    name: "Behavioral tests (PHP ${{ matrix.php }}, ${{ matrix.db.image }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        db:
          - { engine: mysql, image: 'mariadb:10.6', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' }
          - { engine: pgsql, image: 'postgres:14-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' }
        include:
          # Additional MySQL engines.
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.0', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.4', db: { engine: mysql, image: 'mysql:8.4', port: 3306, options: '--health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          # Bleeding-edge engines.
          - { php: '8.5', db: { engine: mysql, image: 'mariadb:12.2', port: 3306, options: '--health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3' } }
          - { php: '8.5', db: { engine: pgsql, image: 'postgres:18-alpine', port: 5432, options: '--health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3' } }
    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_USER: neos
          MYSQL_PASSWORD: neos
          MYSQL_DATABASE: flow_functional_testing
          MYSQL_ROOT_PASSWORD: neos
          POSTGRES_USER: neos
          POSTGRES_PASSWORD: neos
          POSTGRES_DB: flow_functional_testing
        ports:
          - "${{ matrix.db.port }}:${{ matrix.db.port }}"
        options: ${{ matrix.db.options }}
      redis:
        image: redis:alpine
        ports:
          - "6379:6379"
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      memcached:
        image: memcached:alpine
        ports:
          - "11211:11211"
    defaults:
      run:
        working-directory: ${{ env.NEOS_DIST_FOLDER }}
    steps:
      # Local composite actions are resolved from the workspace root, so the
      # workflow's own repository must be checked out before `prepare-neos` runs.
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-neos
        with:
          php-version: ${{ matrix.php }}
          dependencies: ${{ matrix.dependencies || 'highest' }}
          collection-path: ${{ env.NEOS_FOLDER }}
          distribution-path: ${{ env.NEOS_DIST_FOLDER }}

      - uses: ./.github/actions/configure-neos
        with:
          db-engine: ${{ matrix.db.engine }}
          db-port: ${{ matrix.db.port }}
          working-directory: ${{ env.NEOS_DIST_FOLDER }}
          flow-context: ${{ env.FLOW_CONTEXT }}

      - name: Run behat tests
        run: |
          FLOW_CONTEXT=Testing/Behat ./flow doctrine:create
          FLOW_CONTEXT=Testing/Behat ./flow doctrine:migrationversion --add --version all
          bin/behat --stop-on-failure -f progress -c Packages/Neos/Neos.Neos/Tests/Behavior/behat.yml.dist --tags ~@browser
          bin/behat --stop-on-failure -f progress -c Packages/Neos/Neos.ContentRepository/Tests/Behavior/behat.yml.dist

  buildall:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    name: CI build (matrix)
    needs: [static-analysis, unit-tests, functional-tests, behavioral-tests]
    steps:
      - name: Check matrix status
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
